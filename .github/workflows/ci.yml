name: CI

# `development` is the integration branch and the repo default — every feature
# branch is cut from it and merged back into it. Triggering on `main` alone meant
# the branch that receives all the work had ZERO checks, which is how GH-124
# merged 10 failing tests on 2026-07-11 and went unnoticed for 9 days (GH-178).
# `main` stays listed so release merges are still gated. (GH-177)
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  # Recovered from the retiring repo's stranded PR queue (GH-5 Phase R, old
  # PR #302 / GH-298): the same lint gate, with the baseline resolved against
  # THIS tree. Two real bugs surfaced by the ruff baseline: an F821 NameError
  # in the commit-backfill error path (the error handler itself crashed) and a
  # latent F821 annotation in doctor.py.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  # GH-92. GH-88 found 136 broken relative links in tracked docs (ROADMAP.md alone
  # held 107) and 45% breakage overall, none of which any test could catch -- a doc
  # link is never exercised, so nothing fails until someone audits. This holds the
  # count at zero and blocks committed machine-local paths, which have leaked twice.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documentation links
        run: python3 scripts/check_doc_links.py

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy
      - name: Type check
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # server extra: rebalance.web imports FastAPI at module level, so
          # the web-surface tests need it. pytest: the suite is pytest-run
          # locally and some modules are pytest-style (unittest discover
          # can't collect them, and one imports pytest at module scope).
          # embeddings extra: tests/test_embedder*.py patch sentence_transformers,
          # which requires it to be importable (GH-81). It pulls torch, which is
          # why the job timeout above is 25 rather than 10 minutes.
          #
          # Install torch from PyTorch's CPU index FIRST. On Linux, plain
          # `pip install torch` resolves to the CUDA build — several GB of
          # nvidia-* wheels this runner has no GPU to use. Satisfying the
          # requirement up front with the CPU wheel keeps the install small;
          # the line below then finds torch already present.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[calendar,server,embeddings]" pytest
          # HiQS is a standalone package with its own pyproject, and the step below runs its
          # suite. That step was added without this line, so it had never once passed: every
          # run since died collecting four test modules on `No module named 'numpy'`, which
          # HiQS declares and nothing installed. Installing the package rather than
          # hand-listing the missing import is deliberate — HiQS's own dependency note warns
          # that hand-picking is how a declared requirement gets silently omitted, and this
          # way a dependency added there tomorrow is installed here tomorrow.
          pip install -e HiQS/

      # tests/test_pulse_reconcile.py drives real `git pull --rebase` against a
      # throwaway clone. Without an identity that dies with code 128 on a fresh
      # runner — a CI-environment gap, not a product bug, and one only CI ever
      # hits (developer machines always have a global identity). (GH-177)
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@rebalance-os.invalid"
          git config --global user.name "rebalance-OS CI"
          git config --global init.defaultBranch main

      # 3-Eyes is deferred (2026-08-17, operator decision) — its tests are NOT run
      # here. It is documented alpha and outside the supported core, and gating the
      # core suite on it meant an unsupported component could hold up supported work.
      # The code stays in the tree; this is a pause, not a removal. To resume, add
      # `utils/3-eyes/tests` back to this line.
      - name: Run tests
        run: python -m pytest tests/ -q

      # HiQS runs as its OWN pytest process, not appended to the line above.
      # It is a standalone package with its own pyproject, destined for
      # extraction to HiQS-Suite/HiQS — running it in the incumbent's process is
      # the very coupling its clean-room gate exists to prevent, and it is not
      # hypothetical: sharing a process makes
      # test_github_failure_continues_logs_error_and_keeps_watermark fail on
      # state leaked from tests/ (reproduced on pristine main; tracked separately).
      # This step is how HiQS will run after extraction. It shipped without the install
      # its own package needed, so it was red from the day it was added — see the install
      # step above.
      - name: HiQS suite (isolated — standalone package)
        run: python -m pytest HiQS/tests -q

      # The 3-Eyes registry/dashboard sync check was removed here on 2026-08-17 for
      # the same reason as its test run above. Restoring it means re-adding a step
      # that runs `python -m three_eyes.dashboard --check` from `utils/3-eyes`.

      - name: Check for raw datetime parsing (use parse_calendar_dt)
        run: |
          if grep -rn "replace('Z'" src/rebalance/ingest/ --include="*.py" \
               | grep -v "# raw-ok" | grep -v calendar_helpers.py; then
            echo "::error::Raw Z-replace found — use parse_calendar_dt() from calendar_helpers.py"
            exit 1
          fi

      - name: Check for raw duration calculation (use event_duration_minutes)
        run: |
          if grep -rn "total_seconds() / 60" src/rebalance/ --include="*.py" \
               | grep -v "# raw-ok" | grep -v calendar_helpers.py; then
            echo "::error::Raw duration calc found — use event_duration_minutes() from calendar_helpers.py"
            exit 1
          fi

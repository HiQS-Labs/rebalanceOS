[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebalance-os"
version = "0.83.1"
description = "Local-first workday operating system with MCP tools and Obsidian ingest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.1",
  "questionary>=2.0.1",
  # Capped at <2: mcp 2.0.0 removed mcp.server.fastmcp, which src/rebalance/mcp/
  # imports in 8 modules. See GH-225.
  "mcp>=1.0.0,<2",
  "sqlite-vec>=0.1.6",
  "keyring>=25.0.0",
]

[project.optional-dependencies]
calendar = [
  "google-api-python-client>=2.0.0",
  "google-auth-oauthlib>=1.0.0",
  "google-auth-httplib2>=0.2.0",
]
embeddings = [
  # GH-81 moved the embedder off mlx-embeddings to sentence-transformers
  # (BAAI/bge-small-en-v1.5). The extra was left declaring the old package,
  # so CI installed it and then died importing the new one — three tests in
  # tests/test_embedder*.py on ModuleNotFoundError. Declare what the code
  # actually imports.
  "sentence-transformers>=3.0.0",
]
local-llm = [
  # GH-108: mlx-lm powers local Qwen LLM synthesis (Mac Apple Silicon).
  "mlx-lm>=0.19.0",
]
server = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
]
gcp = [
  "google-cloud-secret-manager>=2.0.0",
]
dev = [
  "hypothesis>=6.100.0",
  "mypy>=1.11",
  "pytest>=8.0.0",
  "ruff>=0.6",
]

[project.scripts]
rebalance = "rebalance.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship SQL migration files inside the wheel so run_migrations() can find them.
"rebalance.ingest.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
xfail_strict = true



[tool.ruff]
line-length = 120
target-version = "py312"
# Lint scope is the product trees; everything else at the repo root is
# vendored, generated, or process artifacts. (Exclude list re-validated
# against THIS repo when the old repo's stranded lint PR was recovered —
# entries that only existed there were dropped.)
extend-exclude = [
  # .claude skills are prose documentation whose embedded code snippets are
  # illustrative, not product code the formatter should gate (GH-34).
  ".claude",
  # Restored predecessor documents (GH-88). Same reasoning as .claude above, plus one more:
  # these are an archival record of another repo. Reformatting their embedded snippets would
  # edit history to satisfy a formatter.
  "PROJECT/4-MISC/ARCHIVED-PREDECESSOR",
  "macOS",
  "vscode-extensions",
  "temp",
  "ask_self",
  "experimental",
  ".swe-diagram",
  # Vendored verbatim from XYZ-forge (the release-ledger app). Linting it here
  # would fork it from upstream over B007/B023 style nits, and the next
  # `xyz-sync` would silently revert the fix. Named individually, not as
  # `utils/py/`, so first-party code added beside them is still linted.
  "utils/py/releases_app.py",
  "utils/py/releases_cycle.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
  # Long-line backlog: burn down and re-enable (GH-298 / GH-5 Phase R).
  "E501",
  # typer.Option(...) defaults are the CLI framework's idiom, not a bug.
  "B008",
  # Optional heavy deps are deliberately lazy-imported after capability checks.
  "E402",
  # Legacy raise-without-from and unbounded zip() sites; tighten in a follow-up.
  "B904",
  "B905",
]

[tool.ruff.lint.per-file-ignores]
# Broad assertRaises(Exception) is acceptable in tests for now.
"tests/**" = ["B017"]
"utils/3-eyes/tests/**" = ["B017"]
"HiQS/tests/**" = ["B017"]
# Legacy re-export shim: domain names stay importable from the old paths.
"src/rebalance/cli/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
  "macOS",
  "vscode-extensions",
  "temp",
  "ask_self",
  "experimental",
  ".swe-diagram",
]

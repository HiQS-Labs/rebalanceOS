# Signal Integrity — the second marathon under build 0.75.0 Fleet Engine.
#
# Fleet Engine's original MARATHON.yaml (#29/#23/#22/#4/#1) is about the collector STACK.
# This plan is about the ingest path that feeds it, which is currently starved: the hourly
# GitHub sync spends the token's whole 5000/hour allowance and dies, the health reporter that
# would tell you so dies on the same 403, and a resolver that shipped four days ago was never
# called. Ordered root cause first, because every phase after si1 depends on there being
# quota left to run in.
#
# Run it. Two things this repo needs that the defaults do not give you:
#   1. There is no root validate.sh, so the pre-advance gate MUST be supplied or the run
#      fails fast before turn 1.
#   2. The gate must use the venv interpreter. `python3 -m pytest` collects ZERO tests here
#      (the system interpreter cannot import the package) and a zero-test pass is a gate that
#      approves everything — the exact shape of failure this build exists to remove.
#      `.venv/bin/python -m pytest -q` collects 2441.
#
#   .xyz/relay-automation/marathon.sh \
#     --plan PROJECT/2-WORKING/BUILD-0.75.0-FLEET-ENGINE/MARATHON-signal-integrity.yaml \
#     --pre-advance-cmd ".venv/bin/python -m pytest -q" --dry-run
name: build-0750-signal-integrity
phases:
  - id: si1
    name: Rate-limit budget and ETag conditional requests in GitHubClient (#54, #62)
    reviewer: agy
    brief: PROJECT/2-WORKING/BUILD-0.75.0-FLEET-ENGINE/phases-briefs/si1-ratelimit-budget-etag.md
    artifact: src/rebalance/ingest/_http.py,tests/test_http_client.py
    turn_timeout_s: 900
    max_review_rounds: 3

  - id: si2
    name: Two-tier ingest cadence — hourly delta, daily deep scan (#62)
    reviewer: agy
    brief: PROJECT/2-WORKING/BUILD-0.75.0-FLEET-ENGINE/phases-briefs/si2-two-tier-ingest-cadence.md
    artifact: src/rebalance/ingest/github_scan.py,tests/test_github_scan.py
    turn_timeout_s: 900
    max_review_rounds: 3
    depends_on: si1

  - id: si3
    name: Route health_issue_reporter.py through GitHubClient (#75)
    reviewer: agy
    brief: PROJECT/2-WORKING/BUILD-0.75.0-FLEET-ENGINE/phases-briefs/si3-health-reporter-through-client.md
    artifact: scripts/health_issue_reporter.py,tests/test_health_issue_reporter.py
    turn_timeout_s: 900
    max_review_rounds: 3
    depends_on: si2

  - id: si4
    name: Wire resolve_slack_user into sleuth_candidates (#123)
    reviewer: agy
    brief: PROJECT/2-WORKING/BUILD-0.75.0-FLEET-ENGINE/phases-briefs/si4-wire-slack-resolver.md
    artifact: src/rebalance/ingest/next_actions.py,tests/test_next_actions.py
    turn_timeout_s: 900
    max_review_rounds: 3
    depends_on: si3
